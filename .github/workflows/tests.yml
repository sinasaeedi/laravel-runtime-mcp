name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Pint and PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, pdo_sqlite, sockets
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: composer analyse

  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        db: [pgsql, mysql, mariadb]
        include:
          - laravel: '12.*'
            testbench: '^10.8'
          - laravel: '13.*'
            testbench: '^11.0'
        exclude:
          - php: '8.2'
            laravel: '13.*'
    env:
      RUNTIME_MCP_TEST_REQUIRE_DATABASES: '1'
      RUNTIME_MCP_TEST_MYSQL_DRIVER: ${{ matrix.db == 'mariadb' && 'mariadb' || 'mysql' }}
      RUNTIME_MCP_TEST_MYSQL_PORT: ${{ matrix.db == 'mariadb' && '53307' || '53306' }}
    steps:
      - uses: actions/checkout@v7
      - name: Start ${{ matrix.db }}
        run: docker compose up -d --wait ${{ matrix.db }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, sockets
          coverage: none
      - name: Install Laravel ${{ matrix.laravel }}
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress
      - name: Fast suites
        run: vendor/bin/pest --testsuite=Unit,Feature,Arch
      - name: Database group
        run: vendor/bin/pest --group=${{ matrix.db == 'pgsql' && 'pgsql' || 'mysql' }}

  lowest:
    name: Lowest · PHP 8.2 · Laravel 12 · pgsql + mariadb 10.11
    runs-on: ubuntu-latest
    env:
      RUNTIME_MCP_TEST_REQUIRE_DATABASES: '1'
      RUNTIME_MCP_TEST_MYSQL_DRIVER: mariadb
      RUNTIME_MCP_TEST_MYSQL_PORT: '53308'
    steps:
      - uses: actions/checkout@v7
      - name: Start pgsql and mariadb 10.11
        run: docker compose up -d --wait pgsql mariadb10
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, sockets
          coverage: none
      # The Laravel 12 floor (^12.69.0) is the first 12.x release with no security advisory:
      # Composer 2.9+ will not install an insecure version, so a lower floor could not be proved here.
      # composer.json also sets a dev floor for guzzlehttp/promises (^2.0.3): with Composer < 2.9,
      # --prefer-lowest picks 1.5.3, whose PromiseInterface::wait() does not match Laravel's FluentPromise.
      - name: Install the lowest versions
        run: |
          composer require --dev "laravel/framework:12.*" "orchestra/testbench:^10.8" --no-update --no-interaction
          composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Fast suites
        run: vendor/bin/pest --testsuite=Unit,Feature,Arch
      - name: PostgreSQL group
        run: vendor/bin/pest --group=pgsql
      - name: MariaDB 10.11 group
        run: vendor/bin/pest --group=mysql
